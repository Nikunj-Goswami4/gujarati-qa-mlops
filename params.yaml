model:
  # name: "ai4bharat/indic-bert"
  name: "google/muril-base-cased"
  max_length: 384     # Absolute architectural limit for MuRIL is 512
  doc_stride: 128

training:
  learning_rate: 3e-5 # Standard stable rate for MuRIL fine-tuning
  batch_size: 16       # Optimal size for 16GB VRAM at 512 max_length to prevent cloud OOM
  gradient_accumulation_steps: 1 # No accumulation needed; batch size 16 fits natively in cloud VRAM
  num_epochs: 8
  warmup_steps: 100
  weight_decay: 0.01
  seed: 42

evaluation:
  n_best: 20
  max_answer_length: 30